<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio API</title>
    <script src="audio.js" defer></script>
</head>
<body>
    <h1>Audio API</h1>
    <audio src="Universfield%20-%20Mysterious%20Cinematic%20Music%20Box.mp3" id="audio"></audio>
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="stop">Stop</button>
    <div id="current-time"></div>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1"/>
    <p>Song Title: <a href="https://freemusicarchive.org/music/universfield/horror-background/dark-mystery-atmosphere/">Dark Mystery Atmosphere</a></p>
    <p>Author: <a href="https://freemusicarchive.org/music/universfield/">Universfield</a></p>
</body>
</html>
