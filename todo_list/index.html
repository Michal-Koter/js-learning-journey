<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div id="container">
    <div id="header">
        <h1>Todo List</h1>
    </div>
    <form id="todo-form">
        <input type="text" class="todo-text" placeholder="Add Todo...">
        <button type="submit"></button>
    </form>
    <div id="todo-list">
        <!--There will be added to do items-->
    </div>
</div>
</body>
</html>
