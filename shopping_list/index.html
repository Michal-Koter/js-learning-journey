<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping List</title>
    <script src="https://cdn.tailwindcss.com"></script>
<!--    Provide you Fontawsome kit key-->
    <script src="https://kit.fontawesome.com/{}.js" crossorigin="anonymous"></script>
    <script src="src/script.js" defer></script>
</head>
<body class="bg-gray-50 min-h-screen py-8">
<div class="container mx-auto px-4 max-w-2xl">
    <div id="header" class="flex items-center justify-center gap-3 mb-8 text-4xl font-bold text-gray-800">
        <i class="fa-solid fa-list-check text-blue-600"></i>
        <h1 id="title">Shopping List</h1>
    </div>
    <div id="input-area" class="mb-6">
        <form id="shoping-list-form" class="flex">
            <input type="text" id="item-input" class="flex-1 border-2 border-gray-300 rounded-l-lg px-4 py-3 transition-colors focus:outline-none focus:border-blue-500" placeholder="Add an item...">
            <button type="submit" id="add-button" class="bg-blue-500 hover:bg-blue-700 text-white font-semibold rounded-r-lg px-6 py-3 transition-colors duration-200"><i class="fa-solid fa-plus"></i> Add Item</button>
        </form>
    </div>

    <div id="list" class="mb-6">
        <input type="text" id="filter" placeholder="Filter Items" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 mb-4 transition-colors focus:outline-none focus:border-blue-500">
        <ul id="shopping-list" class="space-y-3">
            <!-- List items will be dynamically added here -->
        </ul>
    </div>

    <div id="clear" class="flex justify-center">
        <button id="clear-button" class="bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg px-6 py-3 transition-colors duration-200 flex items-center gap-2 shadow-md">
            <i class="fa-solid fa-trash"></i>
            Clear List
        </button>
    </div>
</div>
</body>
</html>
