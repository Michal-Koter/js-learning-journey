<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping List</title>
    <link rel="stylesheet" href="src/style.css">
<!--    Provide you Fontawsome kit key-->
    <script src="https://kit.fontawesome.com/{}.js" crossorigin="anonymous"></script>
    <script src="src/script.js" defer></script>
</head>
<body class="main">
<div class="my-container">
    <div id="header" class="header">
        <i class="fa-solid fa-list-check text-blue-600"></i>
        <h1 id="title">Shopping List</h1>
    </div>
    <div id="input-area" class="mb-6">
        <form id="shoping-list-form" class="flex">
            <input type="text" id="item-input" class="text-input" placeholder="Add an item...">
            <button type="submit" id="add-button" class="submit-button"><i class="fa-solid fa-plus"></i> Add Item</button>
        </form>
    </div>

    <div id="list" class="mb-6">
        <input type="text" id="filter" placeholder="Filter Items" class="filter-input">
        <ul id="shopping-list" class="space-y-3">
            <!-- List items will be dynamically added here -->
        </ul>
    </div>

    <div id="clear" class="flex justify-center">
        <button id="clear-button" class="clear-button">
            <i class="fa-solid fa-trash"></i>
            Clear List
        </button>
    </div>
</div>
</body>
</html>
